name: Protected systemd qualification
on:
  push:
    branches: [codex/native-cleanup-authority]
    paths:
      - .github/workflows/protected-systemd-qualification.yml
      - tests/hermes_cli/test_kanban_protected_systemd_live.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Prepare root-controlled isolated test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/hermes-systemd-test/source /opt/hermes-systemd-test/home
          sudo cp -a "$pythonLocation" /opt/hermes-systemd-test/python
          git archive HEAD | sudo tar -x -C /opt/hermes-systemd-test/source
          sudo chown -R root:root /opt/hermes-systemd-test
          sudo chmod -R go-w /opt/hermes-systemd-test
          sudo /opt/hermes-systemd-test/python/bin/python3 -m pip install uv==0.12.18
          sudo /opt/hermes-systemd-test/python/bin/python3 -m uv sync --locked --extra dev --project /opt/hermes-systemd-test/source --python /opt/hermes-systemd-test/python/bin/python3
          sudo useradd --system --create-home hermes
          sudo loginctl enable-linger root
          sudo systemctl start user@0.service
          sudo test -S /run/user/0/bus
          sudo systemd-run --version
          sudo git -C /opt/hermes-systemd-test/source init -q
          sudo git -C /opt/hermes-systemd-test/source add hermes_cli/kanban_db_dispatch.py
      - name: Run one canonical serial real-systemd test
        shell: bash
        run: |
          set -euo pipefail
          sudo env HOME=/opt/hermes-systemd-test/home HERMES_HOME=/opt/hermes-systemd-test/home/hermes HERMES_TEST_FILE_RETRIES=0 \
            bash /opt/hermes-systemd-test/source/scripts/run_tests.sh -j 1 --file-timeout 90 \
            tests/hermes_cli/test_kanban_protected_systemd_live.py -s --tb=short --maxfail=1 2>&1 | tee systemd-qualification.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: protected-systemd-evidence
          path: systemd-qualification.log
          if-no-files-found: ignore
